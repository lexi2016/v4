[project]
name = "v4-app"
version = "0.1.0"
description = "Independent V4 application foundation"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.128,<1.0",
  "uvicorn>=0.40,<1.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=9.0,<10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-W error"
