name: V4 CI
on:
  push:
    branches: [main, 'codex/**', 'fix/**', 'chore/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v4-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - run: python tools/check_repository.py
      - run: python -m unittest discover -s tools/tests -v
  locked-python-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.10.0'
      - run: uv lock --check
      - run: uv sync --locked --group dev --extra data
      - run: uv run --locked --group dev --extra data python tools/run_offline_checks.py --suite regression
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: locked-python-regression-evidence
          path: .ci-results/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
  all-python-collection:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.10.0'
      - run: uv lock --check
      - run: uv sync --locked --group dev --extra data
      - run: uv run --locked --group dev --extra data python tools/run_offline_checks.py --suite collection
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: all-python-collection-evidence
          path: .ci-results/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
  web-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
