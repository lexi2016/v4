name: Bug报告
description: 报告可复现的V4缺陷；不要粘贴凭证或原始私有数据。
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: identity
    attributes:
      label: 版本和运行组件
      description: commit、release、API/调度/Stage、Python/Node；只给脱敏路径。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤、实际结果与期望结果
      description: 包含日期/阶段/输入SHA；不要用当前行情重造历史。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏错误与最小回归
      description: 首个错误、退出码、相关测试；不要上传完整环境或账户。
