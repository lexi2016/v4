  "components": {
    "schemas": {
      "HTTPValidationError": {
        "properties": {
          "detail": {
            "items": {
              "$ref": "#/components/schemas/ValidationError"
            },
            "type": "array",
            "title": "Detail"
          }
        },
        "type": "object",
        "title": "HTTPValidationError"
      },
      "ValidationError": {
        "properties": {
          "loc": {
            "items": {
              "anyOf": [
                {
                  "type": "string"
                },
                {
                  "type": "integer"
                }
              ]
            },
            "type": "array",
            "title": "Location"
          },
          "msg": {
            "type": "string",
            "title": "Message"
          },
          "type": {
            "type": "string",
            "title": "Error Type"
          },
          "input": {
            "title": "Input"
          },
          "ctx": {
            "type": "object",
            "title": "Context"
          }
        },
        "type": "object",
        "required": [
          "loc",
          "msg",
          "type"
        ],
        "title": "ValidationError"
      },
      "SavedResult": {
        "type": "object",
        "properties": {
          "trade_date": {
            "type": "string",
            "pattern": "^[0-9]{8}$"
          },
          "as_of": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time",
            "description": "Source-recorded time only; null with a reason when not recorded."
          },
          "observed_at": {
            "type": "string",
            "format": "date-time"
          },
          "status": {
            "type": "string",
            "enum": [
              "valid",
              "stale",
              "unknown",
              "unavailable"
            ]
          },
          "source_status": {
            "type": [
              "string",
              "null"
            ]
          },
          "market": {
            "type": "string",
            "enum": [
              "A",
              "HK"
            ]
          },
          "missing_reasons": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "source": {
            "type": "array",
            "items": {
              "type": "object"
            }
          },
          "version": {
            "type": "object"
          },
          "rows": {
            "type": "array",
            "items": {
              "type": "object"
            }
          },
          "coverage": {
            "type": "object"
          },
          "RESEARCH_ONLY": {
            "type": "boolean",
            "const": true
          },
          "production_allowed": {
            "type": "boolean",
            "const": false
          },
          "buy_gate_updated": {
            "type": "boolean",
            "const": false
          },
          "orders_sent": {
            "type": "boolean",
            "const": false
          }
        }
      }
    },
    "securitySchemes": {
      "V4ReadOnlyBearer": {
        "type": "http",
        "scheme": "bearer",
        "description": "Dedicated V4 read-only secret; configured separately after approval."
      }
    }
  }
