{
  "openapi": "3.1.0",
  "info": {
    "title": "Saved V4 research reader",
    "version": "v4-readonly-gateway.v1"
  },
  "servers": [
    {
      "url": "https://v4-readonly.example.invalid",
      "description": "NOT_DEPLOYED: replace only after authorized HTTPS verification."
    }
  ],
  "paths": {
    "/health": {
      "get": {
        "summary": "Gateway liveness only; does not prove V4 data is available.",
        "operationId": "savedV4Health",
        "responses": {
          "200": {
            "description": "Saved-data result; inspect status, as_of, source, missing_reasons and pagination.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "status": {
                      "type": "string",
                      "const": "ok"
                    },
                    "version": {
                      "type": "string"
                    },
                    "RESEARCH_ONLY": {
                      "type": "boolean",
                      "const": true
                    },
                    "production_allowed": {
                      "type": "boolean",
                      "const": false
                    },
                    "buy_gate_updated": {
                      "type": "boolean",
                      "const": false
                    },
                    "orders_sent": {
                      "type": "boolean",
                      "const": false
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "GET bodies refused"
          },
          "401": {
            "description": "Authentication refused"
          },
          "404": {
            "description": "No exact saved data or route"
          },
          "405": {
            "description": "Method refused"
          },
          "413": {
            "description": "Reduce page limit; no silent truncation"
          },
          "422": {
            "description": "Invalid parameters"
          },
          "429": {
            "description": "Rate limited"
          },
          "503": {
            "description": "Source unavailable, invalid or concurrency limit"
          },
          "504": {
            "description": "Read deadline exceeded"
          }
        },
        "security": [],
        "x-openai-isConsequential": false
      }
    },
    "/v1/pools": {
      "get": {
        "summary": "Read one exact-date saved pool; follow next_offset for all rows.",
        "operationId": "readSavedV4Pool",
        "parameters": [
          {
            "name": "trade_date",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[0-9]{8}$",
              "description": "Exact saved trading date YYYYMMDD; no latest fallback.",
              "title": "Trade Date"
            },
            "description": "Exact saved trading date YYYYMMDD; no latest fallback."
          },
          {
            "name": "market",
            "in": "query",
            "required": true,
            "schema": {
              "enum": [
                "A",
                "HK"
              ],
              "type": "string",
              "title": "Market"
            }
          },
          {
            "name": "pool_id",
            "in": "query",
            "required": true,
            "schema": {
              "enum": [
                "a_d1_premarket_pool",
                "a_d1_fupan_watchlist_pool",
                "a_d1_stage7_fenshi_review_pool",
                "a_share_research_recommendation_pool",
                "a_share_baimao_research_map",
                "hkconnect_d1_top100",
                "wechat_public_account_v3_preselect"
              ],
              "type": "string",
              "title": "Pool Id"
            }
          },
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "maximum": 50,
              "minimum": 1,
              "default": 20,
              "title": "Limit"
            }
          },
          {
            "name": "offset",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer",
              "maximum": 100000,
              "minimum": 0,
              "default": 0,
              "title": "Offset"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Saved-data result; inspect status, as_of, source, missing_reasons and pagination.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SavedResult"
                }
              }
            }
          },
          "400": {
            "description": "GET bodies refused"
          },
          "401": {
            "description": "Authentication refused"
          },
          "404": {
            "description": "No exact saved data or route"
          },
          "405": {
            "description": "Method refused"
          },
          "413": {
            "description": "Reduce page limit; no silent truncation"
          },
          "422": {
            "description": "Invalid parameters"
          },
          "429": {
            "description": "Rate limited"
          },
          "503": {
            "description": "Source unavailable, invalid or concurrency limit"
          },
          "504": {
            "description": "Read deadline exceeded"
          }
        },
        "security": [
          {
            "V4ReadOnlyBearer": []
          }
        ],
        "x-openai-isConsequential": false
      }
    },
    "/v1/stocks/{code}/research": {
      "get": {
        "summary": "Read one HK stock from a saved plan for an explicit date and phase.",
        "operationId": "readSavedV4StockResearch",
        "parameters": [
