              "title": "Market"
            }
          },
          {
            "name": "phase",
            "in": "query",
            "required": true,
            "schema": {
              "enum": [
                "PREOPEN",
                "INTRADAY",
                "NEXT_DAY",
                "RETROSPECTIVE",
                "MANUAL"
              ],
              "type": "string",
              "title": "Phase"
