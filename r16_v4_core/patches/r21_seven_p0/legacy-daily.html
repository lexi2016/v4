<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>旧版单股归档 · V4</title>
  <style>
    body { max-width: 48rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.6 system-ui, sans-serif; color: #1e3442; background: #f5f8fa }
    main { background: white; border: 1px solid #d4dee5; border-radius: .5rem; padding: 1.25rem }
    a { color: #075688 }
    select { max-width: 100%; padding: .4rem; font: inherit }
    section { margin-top: 1rem; border-top: 1px solid #d4dee5 }
    #archiveIdentity { overflow-wrap: anywhere; font-size: .88rem }
  </style>
  <script type="module" src="./legacy-daily.mjs"></script>
</head>
<body>
  <main>
    <a id="archiveReturn" href="./workbench.html">返回研究看板</a>
    <h1>旧版单股归档</h1>
    <p>原入口由隔离研究看板的同日已保存归档提供读取。历史 PIT 待核。</p>
    <p id="archiveDate"></p>
    <p id="archiveStatus" role="status">正在核对收盘源日及归档身份。</p>
    <label id="archiveSelection" hidden>归档证券 <select id="archiveSymbol"></select></label>
    <section id="archiveRecord" hidden aria-label="单股归档记录">
      <h2 id="archiveName"></h2>
      <p id="archiveStockStatus" role="status"></p>
      <p id="archiveQuote"></p>
      <p id="archiveIdentity"></p>
      <a id="archiveChart" href="./workbench.html">打开同日原公式日 K 与研究详情</a>
    </section>
  </main>
</body>
</html>
